<!DOCTYPE html>
<html>

    <style>
        body {

            padding: 20px;
            background-color: #f5f5f5;
        }
        .signature {
            font-family: "Special Elite", monospace, Courier, sans-serif;
            line-height: 1.3;
            color: #333;
            max-width: 500px;
        }
        .name {
            font-size: 24px;
            font-weight: bold;
            color: #000;
            margin: 0 0 5px 0;
        }
        .business-name {
            font-size: 16px;
            color: #2c5aa0;
            font-weight: bold;
            margin: 0 0 8px 0;
        }
        .contact-info {
            font-size: 14px;
            color: #666;
            margin: 3px 0;
        }
        .contact-info a {
            color: #2c5aa0;
            text-decoration: underline;
        }
        .contact-info a:hover {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="signature">
        <div class="name">Elliott Lowe</div>
        <div class="business-name">Elliott Lowe Voice Talent | <a href="https://lowevoice.com">www.lowevoice.com</a></div>

        <div class="contact-info">Mobile: +1 949.246.2426</div>
        <div class="contact-info">Source Connect: lowevoice</div>
        <div class="contact-info">Patch: <a href="tel:+17164271083">+1 716.427.1083</a> ; 593138#</div>
        
        <div style="margin-top: 10px;">
            <a href="https://lowevoice.com">
                <img src="https://lowevoice.com/assets/images/Headline.png" alt="Elliott Lowe Voice Talent" style="max-width: 200px; height: auto; border: none;">

</html>
